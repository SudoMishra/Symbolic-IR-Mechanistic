<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc">
<title id="title">Figure 1: Raw identifiers versus symbolic IR</title>
<desc id="desc">A raw UUID-heavy prompt compared with a compact typed symbolic prompt and an external mapping vault.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:13px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:12.5px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.5}
</style>
<text x="50" y="44" class="title" text-anchor="start">Figure 1 — Representation boundary between software and model</text>
<text x="50" y="72" class="subtitle" text-anchor="start">Trusted software replaces transport keys with request-scoped handles; literal values never enter model context.</text>
<rect x="50" y="110" width="520" height="310" rx="14" fill="#fff8f8" stroke="#efc4ca" stroke-width="1"/>
<text x="75" y="142" class="label" text-anchor="start" fill="#c43d4b">Raw Application State (Database &amp; Storage)</text>
<text x="75" y="168" class="small" text-anchor="start">Transport keys: UUIDs, primary keys, account numbers (~25–35 tokens/ID)</text>
<text x="75" y="202" class="mono" text-anchor="start">Source 8ce71ad9-71f2-4a03-b7f2-26f64e0db302:</text>
<text x="75" y="227" class="mono" text-anchor="start">  Account ACCT-GB-4490-9812 belongs to Maya Chen.</text>
<text x="75" y="252" class="mono" text-anchor="start">  Contact: maya.chen@internal.corp</text>
<text x="75" y="277" class="mono" text-anchor="start"></text>
<text x="75" y="302" class="mono" text-anchor="start">Source b3a02e31-4f09-4d31-b90f-8a884315c28a:</text>
<text x="75" y="327" class="mono" text-anchor="start">  Account ACCT-US-8177-2044 belongs to Luis Ortiz.</text>
<text x="75" y="352" class="mono" text-anchor="start"></text>
<text x="75" y="377" class="mono" text-anchor="start">Question: Which account belongs to Maya? Cite the UUID.</text>
<line x1="580" y1="240" x2="680" y2="240" stroke="#315efb" stroke-width="2.5"/>
<line x1="680" y1="240" x2="672.529518182883" y2="245.01915345652276" stroke="#315efb" stroke-width="2.5"/>
<line x1="680" y1="240" x2="672.529518182883" y2="234.98084654347724" stroke="#315efb" stroke-width="2.5"/>
<text x="630" y="225" class="small" text-anchor="middle" fill="#315efb" font-weight="600">canonicalize_request()</text>
<text x="630" y="260" class="small" text-anchor="middle">extracts literals</text>
<rect x="690" y="110" width="610" height="310" rx="14" fill="#f5fbfa" stroke="#acd8d1" stroke-width="1"/>
<text x="715" y="142" class="label" text-anchor="start" fill="#008c83">Model-Visible Symbolic State (LLM Context Window)</text>
<text x="715" y="168" class="small" text-anchor="start">Same semantic facts; compact typed handles (~5.5 tokens/handle)</text>
<text x="715" y="202" class="mono" text-anchor="start">&lt;SOURCE_1&gt;:</text>
<text x="715" y="227" class="mono" text-anchor="start">  &lt;ACCOUNT_1&gt; belongs to Maya Chen.</text>
<text x="715" y="252" class="mono" text-anchor="start">  Contact: &lt;EMAIL_1&gt;.</text>
<text x="715" y="277" class="mono" text-anchor="start"></text>
<text x="715" y="302" class="mono" text-anchor="start">&lt;SOURCE_2&gt;:</text>
<text x="715" y="327" class="mono" text-anchor="start">  &lt;ACCOUNT_2&gt; belongs to Luis Ortiz.</text>
<text x="715" y="352" class="mono" text-anchor="start"></text>
<text x="715" y="377" class="mono" text-anchor="start">Question: Which account belongs to Maya? Return handle.</text>
<line x1="995" y1="425" x2="995" y2="470" stroke="#5f6b7a" stroke-width="2"/>
<line x1="995" y1="470" x2="989.9808465434772" y2="462.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<line x1="995" y1="470" x2="1000.0191534565228" y2="462.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<text x="1005" y="452" class="small" text-anchor="start">model generates symbolic JSON</text>
<rect x="690" y="475" width="610" height="105" rx="14" fill="#fff0e5" stroke="#e97824" stroke-width="1"/>
<text x="715" y="505" class="label" text-anchor="start" fill="#e97824">Deterministic IR Validator (Trusted Application Code)</text>
<text x="715" y="532" class="small" text-anchor="start">Checks strict JSON shape, leakage, handle syntax (&lt;TYPE_N&gt;), and request registry</text>
<text x="715" y="556" class="mono" text-anchor="start">Output: &#x27;{&quot;answer&quot;: &quot;&lt;ACCOUNT_1&gt;&quot;, &quot;references&quot;: [&quot;&lt;SOURCE_1&gt;&quot;]}&#x27;</text>
<line x1="995" y1="585" x2="995" y2="620" stroke="#2d8a57" stroke-width="2"/>
<line x1="995" y1="620" x2="989.9808465434772" y2="612.529518182883" stroke="#2d8a57" stroke-width="2"/>
<line x1="995" y1="620" x2="1000.0191534565228" y2="612.529518182883" stroke="#2d8a57" stroke-width="2"/>
<text x="1005" y="607" class="small" text-anchor="start" fill="#2d8a57" font-weight="600">accepted only</text>
<rect x="690" y="625" width="610" height="95" rx="14" fill="#e8f5ed" stroke="#2d8a57" stroke-width="1"/>
<text x="715" y="655" class="label" text-anchor="start" fill="#2d8a57">Rehydrate Response &amp; Post-Resolution Authorization</text>
<text x="715" y="680" class="small" text-anchor="start">Resolves handles via Vault; enforces business rules, freshness, and permissions</text>
<text x="715" y="702" class="mono" text-anchor="start">Rehydrated: &#x27;ACCT-GB-4490-9812&#x27; -&gt; Authorized for lookup action</text>
<rect x="50" y="475" width="520" height="245" rx="14" fill="#e8edff" stroke="#315efb" stroke-width="1"/>
<text x="75" y="505" class="label" text-anchor="start" fill="#315efb">Protected Mapping Vault (Trusted Software Space)</text>
<rect x="75" y="520" width="160" height="24" rx="4" fill="#c43d4b" stroke="#c43d4b" stroke-width="1"/>
<text x="155" y="536" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">NEVER SENT TO MODEL</text>
<text x="75" y="575" class="mono" text-anchor="start">&lt;SOURCE_1&gt;  &lt;-&gt;  8ce71ad9-71f2-4a03-b7f2-26f64e0db302</text>
<text x="75" y="599" class="mono" text-anchor="start">&lt;SOURCE_2&gt;  &lt;-&gt;  b3a02e31-4f09-4d31-b90f-8a884315c28a</text>
<text x="75" y="623" class="mono" text-anchor="start">&lt;ACCOUNT_1&gt; &lt;-&gt;  ACCT-GB-4490-9812</text>
<text x="75" y="647" class="mono" text-anchor="start">&lt;ACCOUNT_2&gt; &lt;-&gt;  ACCT-US-8177-2044</text>
<text x="75" y="671" class="mono" text-anchor="start">&lt;EMAIL_1&gt;   &lt;-&gt;  maya.chen@internal.corp</text>
<text x="75" y="705" class="small" text-anchor="start">Bound strictly to request_id and tenant session; ephemeral lifecycle.</text>
<line x1="630" y1="240" x2="630" y2="390" stroke="#315efb" stroke-width="2" stroke-dasharray="4,4"/>
<line x1="630" y1="390" x2="310" y2="470" stroke="#315efb" stroke-width="2"/>
<line x1="310" y1="470" x2="316.0301083866171" y2="463.3188479402389" stroke="#315efb" stroke-width="2"/>
<line x1="310" y1="470" x2="318.4647554280791" y2="473.05743610608704" stroke="#315efb" stroke-width="2"/>
<text x="480" y="440" class="small" text-anchor="middle" fill="#315efb">stores reversible map</text>
<line x1="575" y1="672" x2="685" y2="672" stroke="#2d8a57" stroke-width="2.5"/>
<line x1="685" y1="672" x2="677.529518182883" y2="677.0191534565228" stroke="#2d8a57" stroke-width="2.5"/>
<line x1="685" y1="672" x2="677.529518182883" y2="666.9808465434772" stroke="#2d8a57" stroke-width="2.5"/>
<text x="630" y="660" class="small" text-anchor="middle" fill="#2d8a57" font-weight="600">vault.rehydrate()</text>
</svg>
