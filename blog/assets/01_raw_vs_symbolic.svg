<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Raw identifiers versus symbolic IR</title>
<desc id="desc">A raw UUID-heavy prompt compared with a compact typed symbolic prompt and an external mapping vault.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.4}
</style>
<text x="50" y="48" class="title" text-anchor="start">Move transport identity out of the reasoning loop</text>
<text x="50" y="76" class="subtitle" text-anchor="start">The model sees compact handles; trusted software retains literal identifiers.</text>
<rect x="50" y="120" width="500" height="350" rx="12" fill="#fff8f8" stroke="#efc4ca" stroke-width="1"/>
<text x="78" y="154" class="label" text-anchor="start" fill="#c43d4b">Raw application prompt</text>
<text x="78" y="205" class="mono" text-anchor="start">Source 8ce71ad9-71f2-4a03-b7f2-26f64e0db302</text>
<text x="78" y="252" class="mono" text-anchor="start">Account ACCT-GB-4490-9812 belongs to Maya Chen.</text>
<text x="78" y="299" class="mono" text-anchor="start">Source b3a02e31-4f09-4d31-b90f-8a884315c28a</text>
<text x="78" y="346" class="mono" text-anchor="start">Account ACCT-US-8177-2044 belongs to Luis Ortiz.</text>
<text x="78" y="393" class="mono" text-anchor="start">Which account belongs to Maya? Cite the source UUID.</text>
<rect x="650" y="120" width="500" height="350" rx="12" fill="#f5fbfa" stroke="#acd8d1" stroke-width="1"/>
<text x="678" y="154" class="label" text-anchor="start" fill="#008c83">Model-facing symbolic view</text>
<text x="678" y="205" class="mono" text-anchor="start">&lt;SOURCE_1&gt;</text>
<text x="678" y="252" class="mono" text-anchor="start">&lt;ACCOUNT_1&gt; belongs to Maya Chen.</text>
<text x="678" y="299" class="mono" text-anchor="start">&lt;SOURCE_2&gt;</text>
<text x="678" y="346" class="mono" text-anchor="start">&lt;ACCOUNT_2&gt; belongs to Luis Ortiz.</text>
<text x="678" y="393" class="mono" text-anchor="start">Return the account and supporting source handle.</text>
<line x1="565" y1="290" x2="635" y2="290" stroke="#315efb" stroke-width="3"/>
<line x1="635" y1="290" x2="626.6994646476478" y2="295.57683717391416" stroke="#315efb" stroke-width="3"/>
<line x1="635" y1="290" x2="626.6994646476478" y2="284.42316282608584" stroke="#315efb" stroke-width="3"/>
<text x="600" y="275" class="small" text-anchor="middle">canonicalize</text>
<rect x="340" y="520" width="520" height="90" rx="12" fill="#e8edff" stroke="#b8c5ff" stroke-width="1"/>
<text x="365" y="550" class="label" text-anchor="start" fill="#315efb">Protected request-scoped mapping vault</text>
<text x="365" y="580" class="mono" text-anchor="start">&lt;SOURCE_1&gt; &lt;-&gt; 8ce71ad9...   |   &lt;ACCOUNT_1&gt; &lt;-&gt; ACCT-GB-4490-9812</text>
<line x1="740" y1="470" x2="740" y2="515" stroke="#315efb" stroke-width="2"/>
<line x1="740" y1="515" x2="734.4231628260858" y2="506.6994646476478" stroke="#315efb" stroke-width="2"/>
<line x1="740" y1="515" x2="745.5768371739142" y2="506.6994646476478" stroke="#315efb" stroke-width="2"/>
<text x="765" y="500" class="small" text-anchor="start">rehydrate only after validation</text>
</svg>
