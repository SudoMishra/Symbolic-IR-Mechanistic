<text x="544" y="623" class="small" text-anchor="start" font-weight="600">UUID (36-char)</text>
<text x="80" y="652" class="small" text-anchor="start" font-weight="600">Key result: Qwen and Gemma shift probability toward the newly bound identifier (&gt; 0) under compact formats.</text>
<text x="80" y="676" class="small" text-anchor="start" fill="#5f6b7a">Caveats: Full UUIDs contain more tokens, so total log-prob magnitudes cannot be compared naively across formats.</text>
<text x="80" y="696" class="small" text-anchor="start" fill="#5f6b7a">Gemma cohorts (n=4 and n=2) are small pilot cohorts whose bootstrap intervals cross zero (not statistically conclusive).</text>
