<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 650" role="img" aria-labelledby="title desc">
<title id="title">Stage 7 source-ID swap effects</title>
<desc id="desc">Counterfactual citation log-probability effect after swapping a relevant source identifier with a distractor.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.4}
</style>
<text x="50" y="48" class="title" text-anchor="start">The same geometric signature produced different causal behavior</text>
<text x="50" y="76" class="subtitle" text-anchor="start">Positive values follow the relevant source to its new ID; negative values retain the old association.</text>
