<text x="544" y="630" class="small" text-anchor="start" font-weight="600">UUID (36-char)</text>
<text x="80" y="665" class="small" text-anchor="start" font-weight="600">Key result: Qwen and Gemma shift probability to the new ID (&gt; 0), while LFM strongly reinforces the old ID under compact formats (&lt; 0).</text>
<text x="80" y="690" class="small" text-anchor="start" fill="#5f6b7a">Caveats: Full UUIDs contain more tokens, so total log-prob magnitudes cannot be compared naively across formats. Gemma cohorts (n=4 and n=2) are pilots.</text>
