<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 740" role="img" aria-labelledby="title desc">
<title id="title">Figure 7: Stage 7 source-ID swap effects</title>
<desc id="desc">Counterfactual citation log-probability effect after swapping a relevant source identifier with a distractor.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:13px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:12.5px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.5}
</style>
<text x="50" y="44" class="title" text-anchor="start">Figure 7 — After an ID swap, models do not all rebind to the relevant source</text>
<text x="50" y="72" class="subtitle" text-anchor="start">Change in preference for the identifier newly assigned to the relevant source; paired 95% bootstrap intervals across 66 counterfactual swap directions.</text>
