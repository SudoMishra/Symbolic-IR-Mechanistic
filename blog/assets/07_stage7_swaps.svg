<text x="50" y="44" class="title" text-anchor="start">Figure 7A — After an ID swap, retained models shift toward the newly assigned identifier</text>
<text x="50" y="72" class="subtitle" text-anchor="start">Change in preference for the identifier newly assigned to the relevant source; paired 95% bootstrap intervals across 144 counterfactual prompt swaps (prompt swaps only).</text>
