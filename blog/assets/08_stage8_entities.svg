<text x="120" y="658" class="small" text-anchor="start" font-weight="600">Representation definitions:</text>
<text x="285" y="658" class="small" text-anchor="start">Raw = literal names, emails, account numbers.  Random = arbitrary alphanumeric mask.</text>
<text x="285" y="680" class="small" text-anchor="start">Untyped = &lt;ENTITY_1&gt;, &lt;ENTITY_2&gt; (type-neutral).  Typed = &lt;ACCOUNT_1&gt;, &lt;EMAIL_2&gt; (preserves entity type).</text>
<text x="120" y="712" class="small" text-anchor="start" fill="#172033" font-weight="600">Key finding: Typed handles improved accuracy in five of six local models; Sonnet was saturated and showed no gain.</text>
<text x="120" y="734" class="small" text-anchor="start" fill="#5f6b7a">Data boundary: Every masked representation reduced raw-value output exposure to 0.0% across all seven models.</text>
<text x="120" y="756" class="small" text-anchor="start" fill="#5f6b7a">Sample size: 500 paired semantic examples per model; 14,000 generations in total.</text>
