<title id="title">Figure 8A: Qwen 2.5 component transplants separate first-token binding from identifier continuation</title>
<desc id="desc">Two grouped effect plots show attention-mixer, MLP, and joint component transplants at layers 20 and 24. The left panel shows the raw first-token log-preference shift and the right panel shows the remaining identifier-sequence shift. Points and whiskers are cluster-bootstrap means and 95 percent confidence intervals.</desc>
