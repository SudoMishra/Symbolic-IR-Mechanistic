<title id="title">Figure 8E: Held-Out Causal Subspace Localization &amp; Format Dissociation</title>
<desc id="desc">Three panels illustrate post-evidence residual causal subspace results for Qwen 2.5 1.5B. Panel A displays causal preference shifts across subspace ranks on the held-out confirmation cohort (N=80 examples, 240 cases). Panel B shows format dissociation in recovery between structured, compact, and UUID formats. Panel C displays free-generation behavioral bridge metrics under subspace intervention.</desc>
