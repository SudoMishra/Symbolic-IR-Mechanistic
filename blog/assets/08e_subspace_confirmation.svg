<text x="90.0" y="584.0" class="label" fill="#008c83">HOW TO READ · HELD-OUT CONFIRMATION &amp; BEHAVIORAL BRIDGE</text>
<text x="90.0" y="608.0" class="legend">1. Preregistered Confirmation: Low-rank residual subspace at Layer 14 pos_post_evidence confirmed strictly positive on unseen cohort</text>
<text x="90.0" y="628.0" class="muted">   Rank 8 shift = +0.0297 [+0.0165, +0.0423] (62.3% var explained); Rank 16 shift = +0.0321 [+0.0174, +0.0456] (76.4% var explained). Both exclude zero.</text>
<text x="90.0" y="650.0" class="legend">2. Format Dissociation: Linear subspace actively transfers structured handles (+12.7% recovery), but collapses to negative recovery on UUIDs (-3.1%).</text>
<text x="90.0" y="672.0" class="muted">3. Factual Answer Preservation: Free generation confirms the subspace patch preserves exact answer EM (40.6% clean vs 40.6% patched) while dissociating citations.</text>
