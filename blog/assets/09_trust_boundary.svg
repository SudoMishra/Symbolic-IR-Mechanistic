<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">Figure 9: Symbolic IR trust boundary</title>
<desc id="desc">Architecture showing canonicalization, a protected mapping vault, model-facing typed handles, strict validation, rehydration, and the separate semantic verification boundary.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:13px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:12.5px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.5}
</style>
<text x="50" y="44" class="title" text-anchor="start">Figure 9 — A symbolic handle is a reference, not a capability</text>
<text x="50" y="72" class="subtitle" text-anchor="start">Structural validation guarantees representation integrity; semantic correctness and authorization remain separate responsibilities.</text>
<rect x="40" y="105" width="340" height="480" rx="12" fill="#f4f7fb" stroke="#d0dbee" stroke-width="1"/>
<text x="60" y="130" class="small" text-anchor="start" fill="#315efb" font-weight="700">ZONE 1: TRUSTED APPLICATION SPACE</text>
<rect x="400" y="105" width="430" height="480" rx="12" fill="#fdfcf8" stroke="#ece4d4" stroke-width="1"/>
<text x="420" y="130" class="small" text-anchor="start" fill="#e97824" font-weight="700">ZONE 2: UNTRUSTED MODEL INTERACTION</text>
<rect x="850" y="105" width="510" height="480" rx="12" fill="#f4faf6" stroke="#c8e4d2" stroke-width="1"/>
<text x="870" y="130" class="small" text-anchor="start" fill="#2d8a57" font-weight="700">ZONE 3: TRUSTED VALIDATION &amp; AUTHORIZATION</text>
<rect x="60" y="160" width="300" height="85" rx="10" fill="#e8edff" stroke="#315efb" stroke-width="1"/>
<text x="80" y="188" class="label" text-anchor="start" fill="#315efb">1. Trusted Application State</text>
<text x="80" y="210" class="small" text-anchor="start">Records, DB UUIDs, PII, tool targets</text>
<rect x="60" y="280" width="300" height="85" rx="10" fill="#e2f5f1" stroke="#008c83" stroke-width="1"/>
<text x="80" y="308" class="label" text-anchor="start" fill="#008c83">2. Request-Scoped Canonicalizer</text>
<text x="80" y="330" class="small" text-anchor="start">Replaces literals with typed handles</text>
<line x1="210" y1="245" x2="210" y2="280" stroke="#5f6b7a" stroke-width="2"/>
<line x1="210" y1="280" x2="204.98084654347724" y2="272.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<line x1="210" y1="280" x2="215.01915345652276" y2="272.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<rect x="60" y="410" width="300" height="145" rx="10" fill="#fbfcfe" stroke="#315efb" stroke-width="1"/>
<text x="80" y="435" class="label" text-anchor="start" fill="#315efb">Protected Mapping Vault</text>
<rect x="80" y="448" width="140" height="20" rx="3" fill="#c43d4b" stroke="#c43d4b" stroke-width="1"/>
<text x="150" y="462" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">NEVER SENT TO MODEL</text>
<text x="80" y="492" class="mono" text-anchor="start">&lt;SOURCE_1&gt; &lt;-&gt; 8ce71ad9...</text>
<text x="80" y="514" class="mono" text-anchor="start">&lt;ACCOUNT_1&gt; &lt;-&gt; ACCT-GB-...</text>
<text x="80" y="538" class="small" text-anchor="start">Scoped strictly to current request_id</text>
<line x1="210" y1="365" x2="210" y2="410" stroke="#315efb" stroke-width="2"/>
<line x1="210" y1="410" x2="204.98084654347724" y2="402.529518182883" stroke="#315efb" stroke-width="2"/>
<line x1="210" y1="410" x2="215.01915345652276" y2="402.529518182883" stroke="#315efb" stroke-width="2"/>
<rect x="420" y="160" width="390" height="85" rx="10" fill="#f0ebff" stroke="#7656c9" stroke-width="1"/>
<text x="440" y="188" class="label" text-anchor="start" fill="#7656c9">3. Model-Facing Prompt (Typed IR)</text>
<text x="440" y="210" class="small" text-anchor="start">Compact handles (&lt;SOURCE_1&gt;, &lt;ACCOUNT_1&gt;)</text>
<line x1="360" y1="322" x2="420" y2="202" stroke="#7656c9" stroke-width="2"/>
<line x1="420" y1="202" x2="421.1483662937652" y2="210.92643573075748" stroke="#7656c9" stroke-width="2"/>
<line x1="420" y1="202" x2="412.1698316391349" y2="206.4371684034423" stroke="#7656c9" stroke-width="2"/>
<rect x="420" y="280" width="390" height="85" rx="10" fill="#f0ebff" stroke="#7656c9" stroke-width="1"/>
<text x="440" y="308" class="label" text-anchor="start" fill="#7656c9">4. Probabilistic LLM Generation</text>
<text x="440" y="330" class="small" text-anchor="start">Generates symbolic JSON with handle references</text>
<line x1="615" y1="245" x2="615" y2="280" stroke="#5f6b7a" stroke-width="2"/>
<line x1="615" y1="280" x2="609.9808465434772" y2="272.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<line x1="615" y1="280" x2="620.0191534565228" y2="272.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<rect x="870" y="160" width="470" height="115" rx="10" fill="#fff0e5" stroke="#e97824" stroke-width="1"/>
<text x="890" y="188" class="label" text-anchor="start" fill="#e97824">5. Deterministic IR Validator</text>
<text x="890" y="210" class="small" text-anchor="start">Checks: 1. Strict JSON  2. Raw Leakage  3. Syntax</text>
<text x="890" y="230" class="small" text-anchor="start">        4. Request Registry  5. Type  6. Tool Policy</text>
<line x1="810" y1="322" x2="870" y2="217" stroke="#e97824" stroke-width="2"/>
<line x1="870" y1="217" x2="870.6514486501377" y2="225.97639207344653" stroke="#e97824" stroke-width="2"/>
<line x1="870" y1="217" x2="861.9357575143454" y2="220.99599713870808" stroke="#e97824" stroke-width="2"/>
<rect x="870" y="320" width="470" height="85" rx="10" fill="#e8f5ed" stroke="#2d8a57" stroke-width="1"/>
<text x="890" y="348" class="label" text-anchor="start" fill="#2d8a57">6. Deterministic Rehydration Engine</text>
<text x="890" y="370" class="small" text-anchor="start">Restores raw literals; matches vault registry_id exactly</text>
<line x1="1105" y1="275" x2="1105" y2="320" stroke="#2d8a57" stroke-width="2"/>
<line x1="1105" y1="320" x2="1099.9808465434774" y2="312.529518182883" stroke="#2d8a57" stroke-width="2"/>
<line x1="1105" y1="320" x2="1110.0191534565226" y2="312.529518182883" stroke="#2d8a57" stroke-width="2"/>
<text x="1115" y="300" class="small" text-anchor="start" fill="#2d8a57" font-weight="600">accepted only</text>
<line x1="360" y1="520" x2="840" y2="520" stroke="#2d8a57" stroke-width="2" stroke-dasharray="4,4"/>
<line x1="840" y1="520" x2="870" y2="380" stroke="#2d8a57" stroke-width="2"/>
<line x1="870" y1="380" x2="873.3424571188918" y2="388.356313805044" stroke="#2d8a57" stroke-width="2"/>
<line x1="870" y1="380" x2="863.5269763860659" y2="386.2529965051528" stroke="#2d8a57" stroke-width="2"/>
<text x="540" y="510" class="small" text-anchor="start" fill="#2d8a57" font-weight="600">rehydrate via protected vault</text>
<rect x="870" y="450" width="470" height="105" rx="10" fill="#fff8f8" stroke="#e3a7ae" stroke-width="1"/>
<text x="890" y="478" class="label" text-anchor="start" fill="#c43d4b">7. Application Authorization &amp; Semantic Rules</text>
<text x="890" y="502" class="small" text-anchor="start">Checks: Freshness, ownership, idempotency, permissions</text>
<text x="890" y="524" class="small" text-anchor="start" font-weight="600">Executes tool or serves verified response</text>
<line x1="1105" y1="405" x2="1105" y2="450" stroke="#c43d4b" stroke-width="2"/>
<line x1="1105" y1="450" x2="1099.9808465434774" y2="442.529518182883" stroke="#c43d4b" stroke-width="2"/>
<line x1="1105" y1="450" x2="1110.0191534565226" y2="442.529518182883" stroke="#c43d4b" stroke-width="2"/>
<rect x="40" y="610" width="630" height="190" rx="14" fill="#f2faf5" stroke="#acd8ba" stroke-width="1"/>
<text x="65" y="642" class="label" text-anchor="start" fill="#2d8a57">Structural Integrity Guaranteed (Software Boundary)</text>
<text x="65" y="672" class="body" text-anchor="start">
<tspan x="65" dy="0">• 500/500 valid outputs accepted and rehydrated exactly (100%)</tspan>
<tspan x="65" dy="24">• 5,000/5,000 adversarial payloads rejected across 10 failure classes</tspan>
<tspan x="65" dy="24">• 499/499 cross-request replay attempts blocked (100%)</tspan>
<tspan x="65" dy="24">• 52.26% serialized character reduction in model prompt view</tspan>
<tspan x="65" dy="24">• Median validation overhead: 0.037 ms (negligible CPU latency)</tspan>
</text>
<rect x="700" y="610" width="660" height="190" rx="14" fill="#fff4f5" stroke="#e3a7ae" stroke-width="1"/>
<text x="725" y="642" class="label" text-anchor="start" fill="#c43d4b">The Critical Semantic Limit (Model Responsibility)</text>
<text x="725" y="674" class="body" text-anchor="start" font-weight="600">500 / 500 wrong-but-registered handles passed structural validation.</text>
<text x="725" y="700" class="body" text-anchor="start">
<tspan x="725" dy="0">• A valid handle proves only that the reference is well formed and in-request.</tspan>
<tspan x="725" dy="23">• Structural validation CANNOT detect if the model selected the wrong account.</tspan>
<tspan x="725" dy="23">• High-consequence actions must always enforce independent business rules,</tspan>
<tspan x="725" dy="23">  database ownership constraints, confirmation, or human review after resolution.</tspan>
</text>
</svg>
