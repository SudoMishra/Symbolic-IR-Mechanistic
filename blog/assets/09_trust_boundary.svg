<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Symbolic IR trust boundary</title>
<desc id="desc">Architecture showing canonicalization, a protected mapping vault, model-facing typed handles, strict validation, rehydration, and the separate semantic verification boundary.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.4}
</style>
<text x="50" y="48" class="title" text-anchor="start">A symbolic handle is a reference, not a capability</text>
<text x="50" y="76" class="subtitle" text-anchor="start">Stage 9 makes representation integrity deterministic while leaving semantic correctness and authorization explicit.</text>
<rect x="55" y="150" width="210" height="115" rx="14" fill="#e8edff" stroke="#315efb" stroke-width="1.5"/>
<text x="73" y="184" class="label" text-anchor="start" fill="#315efb">Trusted state</text>
<text x="73" y="218" class="small" text-anchor="start">
<tspan x="73" dy="0">records, sources, tools</tspan>
</text>
<rect x="330" y="150" width="220" height="115" rx="14" fill="#e2f5f1" stroke="#008c83" stroke-width="1.5"/>
<text x="348" y="184" class="label" text-anchor="start" fill="#008c83">Canonicalizer</text>
<text x="348" y="218" class="small" text-anchor="start">
<tspan x="348" dy="0">trusted schema</tspan>
<tspan x="348" dy="22">request-scoped handles</tspan>
</text>
<rect x="620" y="150" width="220" height="115" rx="14" fill="#f0ebff" stroke="#7656c9" stroke-width="1.5"/>
<text x="638" y="184" class="label" text-anchor="start" fill="#7656c9">LLM view</text>
<text x="638" y="218" class="small" text-anchor="start">
<tspan x="638" dy="0">typed handles</tspan>
<tspan x="638" dy="22">symbolic JSON</tspan>
</text>
<rect x="910" y="150" width="220" height="115" rx="14" fill="#fff0e5" stroke="#e97824" stroke-width="1.5"/>
<text x="928" y="184" class="label" text-anchor="start" fill="#e97824">Validator</text>
<text x="928" y="218" class="small" text-anchor="start">
<tspan x="928" dy="0">schema + leakage</tspan>
<tspan x="928" dy="22">registry + type + policy</tspan>
</text>
<rect x="1195" y="150" width="160" height="115" rx="14" fill="#e8f5ed" stroke="#2d8a57" stroke-width="1.5"/>
<text x="1213" y="184" class="label" text-anchor="start" fill="#2d8a57">Rehydrate</text>
<text x="1213" y="218" class="small" text-anchor="start">
<tspan x="1213" dy="0">accepted only</tspan>
</text>
<line x1="273" y1="207" x2="322" y2="207" stroke="#5f6b7a" stroke-width="2"/>
<line x1="322" y1="207" x2="313.6994646476478" y2="212.57683717391416" stroke="#5f6b7a" stroke-width="2"/>
<line x1="322" y1="207" x2="313.6994646476478" y2="201.42316282608584" stroke="#5f6b7a" stroke-width="2"/>
<line x1="558" y1="207" x2="612" y2="207" stroke="#5f6b7a" stroke-width="2"/>
<line x1="612" y1="207" x2="603.6994646476478" y2="212.57683717391416" stroke="#5f6b7a" stroke-width="2"/>
<line x1="612" y1="207" x2="603.6994646476478" y2="201.42316282608584" stroke="#5f6b7a" stroke-width="2"/>
<line x1="848" y1="207" x2="902" y2="207" stroke="#5f6b7a" stroke-width="2"/>
<line x1="902" y1="207" x2="893.6994646476478" y2="212.57683717391416" stroke="#5f6b7a" stroke-width="2"/>
<line x1="902" y1="207" x2="893.6994646476478" y2="201.42316282608584" stroke="#5f6b7a" stroke-width="2"/>
<line x1="1138" y1="207" x2="1187" y2="207" stroke="#5f6b7a" stroke-width="2"/>
<line x1="1187" y1="207" x2="1178.6994646476478" y2="212.57683717391416" stroke="#5f6b7a" stroke-width="2"/>
<line x1="1187" y1="207" x2="1178.6994646476478" y2="201.42316282608584" stroke="#5f6b7a" stroke-width="2"/>
<rect x="350" y="330" width="460" height="110" rx="14" fill="#f3f6fb" stroke="#aeb8c8" stroke-width="1"/>
<text x="372" y="365" class="label" text-anchor="start">Protected mapping vault</text>
<text x="372" y="396" class="body" text-anchor="start">Never enters model context; bound to request and tenant identity</text>
<line x1="440" y1="272" x2="440" y2="322" stroke="#315efb" stroke-width="2"/>
<line x1="440" y1="322" x2="434.42316282608584" y2="313.6994646476478" stroke="#315efb" stroke-width="2"/>
<line x1="440" y1="322" x2="445.57683717391416" y2="313.6994646476478" stroke="#315efb" stroke-width="2"/>
<line x1="720" y1="322" x2="720" y2="272" stroke="#315efb" stroke-width="2"/>
<line x1="720" y1="272" x2="725.5768371739142" y2="280.3005353523522" stroke="#315efb" stroke-width="2"/>
<line x1="720" y1="272" x2="714.4231628260858" y2="280.3005353523522" stroke="#315efb" stroke-width="2"/>
<rect x="55" y="505" width="620" height="170" rx="16" fill="#f2faf5" stroke="#acd8ba" stroke-width="1"/>
<text x="80" y="540" class="label" text-anchor="start" fill="#2d8a57">Deterministic boundary passed</text>
<text x="80" y="575" class="body" text-anchor="start">
<tspan x="80" dy="0">500/500 valid outputs accepted and rehydrated exactly</tspan>
<tspan x="80" dy="24">5,000 malformed, unknown, cross-type, and policy attacks rejected</tspan>
<tspan x="80" dy="24">499/499 cross-request attempts blocked</tspan>
<tspan x="80" dy="24">52.26% fewer serialized characters</tspan>
</text>
<rect x="725" y="505" width="630" height="170" rx="16" fill="#fff4f5" stroke="#e3a7ae" stroke-width="1"/>
<text x="750" y="540" class="label" text-anchor="start" fill="#c43d4b">Semantic boundary remains</text>
<text x="750" y="580" class="body" text-anchor="start">500/500 wrong-but-registered account handles passed structure checks.</text>
<text x="750" y="615" class="body" text-anchor="start">Correctness, authorization, freshness, and business rules still require</text>
<text x="750" y="641" class="body" text-anchor="start">deterministic checks, another verifier, confirmation, or human review.</text>
</svg>
