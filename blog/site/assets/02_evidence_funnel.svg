<rect x="44" y="515" width="1312" height="115" rx="14" fill="#ffffff" stroke="#d8dee8" stroke-width="1"/>
<text x="68" y="552" class="label" text-anchor="start" fill="#172033" font-weight="700">Accounting contract:</text>
<text x="235" y="552" class="body" text-anchor="start">18,020+ behavioral records representing 23,620+ model calls (Stage 5 uses two sequential model calls per record).</text>
<text x="68" y="592" class="label" text-anchor="start" fill="#172033" font-weight="700">Scientific distinction:</text>
<text x="235" y="592" class="subtitle" text-anchor="start">Forward passes, causal interventions, and deterministic software test cases are reported in native units—not combined into one inflated number.</text>
