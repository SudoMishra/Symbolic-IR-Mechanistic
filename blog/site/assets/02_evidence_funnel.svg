<rect x="45" y="495" width="1310" height="95" rx="12" fill="#f8fafc" stroke="#d8dee8" stroke-width="1"/>
<text x="70" y="532" class="label" text-anchor="start" fill="#172033">Accounting contract:</text>
<text x="230" y="532" class="body" text-anchor="start">18,020 behavioral records representing 23,620 model calls (Stage 5 uses two sequential model calls per record).</text>
<text x="70" y="562" class="label" text-anchor="start" fill="#172033">Scientific distinction:</text>
<text x="230" y="562" class="subtitle" text-anchor="start">Forward passes, causal interventions, and deterministic software test cases are reported in native units—not combined into one inflated number.</text>
