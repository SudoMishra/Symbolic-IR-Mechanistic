<text x="76" y="182" class="label" text-anchor="start" fill="#315efb" font-weight="700">Behavioral</text>
<text x="48" y="230" class="title" text-anchor="start" fill="#172033">11,920</text>
<text x="48" y="255" class="label" text-anchor="start" fill="#5f6b7a">model generations</text>
<line x1="44" y1="273" x2="396" y2="273" stroke="#315efb" stroke-width="1" stroke-dasharray="3,3"/>
<text x="48" y="300" class="body" text-anchor="start">
<tspan x="48" dy="0">Citation MVE (2,000)</tspan>
<tspan x="48" dy="20">MuSiQue primary (7,500)</tspan>
<tspan x="48" dy="20">Held-out MuSiQue (2,400)</tspan>
<tspan x="48" dy="20">Smoke gate (20)</tspan>
</text>
<line x1="220" y1="367" x2="220" y2="383" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="383" x2="214.98084654347724" y2="375.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="383" x2="225.01915345652276" y2="375.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="385" width="392" height="220" rx="14" fill="#fff0e5" stroke="#e97824" stroke-width="1.75"/>
<circle cx="52" cy="417" r="16" fill="#e97824" stroke="none" stroke-width="1"/>
<text x="52" y="422" class="label" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<text x="76" y="422" class="label" text-anchor="start" fill="#e97824" font-weight="700">Stress tests</text>
<text x="48" y="470" class="title" text-anchor="start" fill="#172033">5,725</text>
