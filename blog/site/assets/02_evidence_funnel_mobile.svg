<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1580" role="img" aria-labelledby="title desc">
<title id="title">Figure 2: Experimental evidence program, mobile layout</title>
<desc id="desc">Five testing regimes stacked vertically for a narrow screen.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:13px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:12.5px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.5}
</style>
<style>.title{font-size:24px}.subtitle{font-size:13px}.label{font-size:15px}.body{font-size:15px}</style>
<text x="24" y="40" class="title" text-anchor="start">Figure 2 — Experimental evidence</text>
<text x="24" y="70" class="title" text-anchor="start">program across five testing regimes</text>
<text x="24" y="100" class="subtitle" text-anchor="start">Counts preserve the native unit for each regime:</text>
<text x="24" y="120" class="subtitle" text-anchor="start">generations, passes, interventions, or software tests.</text>
<rect x="24" y="145" width="392" height="220" rx="14" fill="#e8edff" stroke="#315efb" stroke-width="1.75"/>
<circle cx="52" cy="177" r="16" fill="#315efb" stroke="none" stroke-width="1"/>
