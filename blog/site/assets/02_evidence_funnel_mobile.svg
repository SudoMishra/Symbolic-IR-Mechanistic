<text x="76" y="662" class="label" text-anchor="start" fill="#7656c9" font-weight="700">Mechanisms</text>
<text x="48" y="710" class="title" text-anchor="start" fill="#172033">960 + 1,122</text>
<text x="48" y="735" class="label" text-anchor="start" fill="#5f6b7a">passes &amp; interventions</text>
<line x1="44" y1="753" x2="396" y2="753" stroke="#7656c9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="48" y="780" class="body" text-anchor="start">
<tspan x="48" dy="0">BF16 CKA geometry (960)</tspan>
<tspan x="48" dy="20">Source-ID swaps (66)</tspan>
<tspan x="48" dy="20">Residual patches (1,056)</tspan>
</text>
<line x1="220" y1="847" x2="220" y2="863" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="863" x2="214.98084654347724" y2="855.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="863" x2="225.01915345652276" y2="855.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="865" width="392" height="220" rx="14" fill="#e2f5f1" stroke="#008c83" stroke-width="1.75"/>
<circle cx="52" cy="897" r="16" fill="#008c83" stroke="none" stroke-width="1"/>
<text x="52" y="902" class="label" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<text x="76" y="902" class="label" text-anchor="start" fill="#008c83" font-weight="700">Entities</text>
<text x="48" y="950" class="title" text-anchor="start" fill="#172033">960</text>
<text x="48" y="975" class="label" text-anchor="start" fill="#5f6b7a">model generations</text>
<line x1="44" y1="993" x2="396" y2="993" stroke="#008c83" stroke-width="1" stroke-dasharray="3,3"/>
<text x="48" y="1020" class="body" text-anchor="start">
<tspan x="48" dy="0">Synthetic account resolution</tspan>
<tspan x="48" dy="20">across 6 model families</tspan>
<tspan x="48" dy="20">Raw vs masked vs typed</tspan>
</text>
<line x1="220" y1="1087" x2="220" y2="1103" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="1103" x2="214.98084654347724" y2="1095.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="1103" x2="225.01915345652276" y2="1095.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="1105" width="392" height="220" rx="14" fill="#e8f5ed" stroke="#2d8a57" stroke-width="1.75"/>
<circle cx="52" cy="1137" r="16" fill="#2d8a57" stroke="none" stroke-width="1"/>
<text x="52" y="1142" class="label" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
<text x="76" y="1142" class="label" text-anchor="start" fill="#2d8a57" font-weight="700">Systems</text>
<text x="48" y="1190" class="title" text-anchor="start" fill="#172033">500 + 5,000</text>
<text x="48" y="1215" class="label" text-anchor="start" fill="#5f6b7a">software test cases</text>
<line x1="44" y1="1233" x2="396" y2="1233" stroke="#2d8a57" stroke-width="1" stroke-dasharray="3,3"/>
<text x="48" y="1260" class="body" text-anchor="start">
<tspan x="48" dy="0">Valid round trips (500)</tspan>
<tspan x="48" dy="20">Adversarial tests (5,000)</tspan>
<tspan x="48" dy="20">Cross-request replays (499)</tspan>
</text>
<rect x="24" y="1355" width="392" height="205" rx="14" fill="#ffffff" stroke="#d8dee8" stroke-width="1"/>
<text x="44" y="1386" class="label" text-anchor="start" fill="#172033" font-weight="700">Accounting contract</text>
<text x="44" y="1412" class="body" text-anchor="start">
<tspan x="44" dy="0">18,605 primary records (24,205 calls)</tspan>
<tspan x="44" dy="21">+ 2,000 validation generations =</tspan>
<tspan x="44" dy="21">20,605 total records / 26,205 calls.</tspan>
</text>
<text x="44" y="1490" class="label" text-anchor="start" fill="#172033" font-weight="700">Scientific distinction</text>
<text x="44" y="1516" class="body" text-anchor="start">
<tspan x="44" dy="0">Forward passes, causal interventions,</tspan>
<tspan x="44" dy="21">and software tests stay in native units</tspan>
<tspan x="44" dy="21">instead of one inflated total.</tspan>
</text>
</svg>
