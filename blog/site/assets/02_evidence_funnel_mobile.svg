<line x1="44" y1="513" x2="396" y2="513" stroke="#e97824" stroke-width="1" stroke-dasharray="3,3"/>
<text x="48" y="540" class="body" text-anchor="start">
<tspan x="48" dy="0">Reasoning-budget 2-pass</tspan>
<tspan x="48" dy="20">(5,600 records / 11,200 calls)</tspan>
<tspan x="48" dy="20">LongProc traces (125)</tspan>
</text>
<line x1="220" y1="607" x2="220" y2="623" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="623" x2="214.98084654347724" y2="615.529518182883" stroke="#5f6b7a" stroke-width="2"/>
<line x1="220" y1="623" x2="225.01915345652276" y2="615.529518182883" stroke="#5f6b7a" stroke-width="2"/>
