<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 390" role="img" aria-labelledby="title desc">
<title id="title">Figure 4B: Anthropic Sonnet reasoning-setting check</title>
<desc id="desc">A separate MuSiQue execution-setting comparison for Claude Sonnet 5.5, showing the change in UUID minus numeric exact binding under no reasoning and adaptive-low settings.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b7a}
.label{font-size:14px;font-weight:600}.body{font-size:13px}.small{font-size:12px;fill:#5f6b7a}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:12.5px}
.axis{stroke:#aeb8c8;stroke-width:1}.grid{stroke:#e5e9f0;stroke-width:1}.zero{stroke:#172033;stroke-width:1.5}
</style>
<text x="50" y="44" class="title" text-anchor="start">Figure 4B — Adaptive-low did not reliably repair Sonnet&#x27;s binding gap</text>
<text x="50" y="72" class="subtitle" text-anchor="start">Separate 100-question MuSiQue check at 15 and 20 sources; this API setting comparison is not the five-budget synthetic task in Figure 4.</text>
<rect x="60" y="125" width="235" height="105" rx="10" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1"/>
<text x="85" y="155" class="label" text-anchor="start">No-reasoning execution</text>
<text x="85" y="202" class="title" text-anchor="start" fill="#e97824">-1.0 pp</text>
<line x1="315" y1="178" x2="385" y2="178" stroke="#5f6b7a" stroke-width="2"/>
<line x1="385" y1="178" x2="377.529518182883" y2="183.01915345652276" stroke="#5f6b7a" stroke-width="2"/>
<line x1="385" y1="178" x2="377.529518182883" y2="172.98084654347724" stroke="#5f6b7a" stroke-width="2"/>
<rect x="405" y="125" width="235" height="105" rx="10" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1"/>
<text x="430" y="155" class="label" text-anchor="start">Adaptive-low execution</text>
<text x="430" y="202" class="title" text-anchor="start" fill="#008c83">+2.0 pp</text>
<line x1="735.0" y1="130" x2="735.0" y2="235" stroke="#d8dee8" stroke-width="1"/>
<text x="735.0" y="255" class="small" text-anchor="middle">-5 pp</text>
<line x1="906.6666666666666" y1="130" x2="906.6666666666666" y2="235" stroke="#172033" stroke-width="1.8"/>
<text x="906.6666666666666" y="255" class="small" text-anchor="middle">+0 pp</text>
<line x1="1078.3333333333333" y1="130" x2="1078.3333333333333" y2="235" stroke="#d8dee8" stroke-width="1"/>
<text x="1078.3333333333333" y="255" class="small" text-anchor="middle">+5 pp</text>
<line x1="1250.0" y1="130" x2="1250.0" y2="235" stroke="#d8dee8" stroke-width="1"/>
<text x="1250.0" y="255" class="small" text-anchor="middle">+10 pp</text>
<text x="735" y="112" class="label" text-anchor="start">Adaptive-low minus no reasoning</text>
<line x1="803.6666666666666" y1="180" x2="1215.6666666666667" y2="180" stroke="#008c83" stroke-width="3"/>
<line x1="803.6666666666666" y1="173" x2="803.6666666666666" y2="187" stroke="#008c83" stroke-width="2"/>
<line x1="1215.6666666666667" y1="173" x2="1215.6666666666667" y2="187" stroke="#008c83" stroke-width="2"/>
<circle cx="1009.6666666666667" cy="180" r="7" fill="#fbfcfe" stroke="#008c83" stroke-width="2.5"/>
<text x="1250" y="112" class="small" text-anchor="end" font-weight="600">+3.0 pp [-3.0, +9.0]</text>
<rect x="60" y="295" width="1230" height="60" rx="10" fill="#f8fafc" stroke="#d8dee8" stroke-width="1"/>
<text x="85" y="320" class="small" text-anchor="start" font-weight="600">Interpretation:</text>
<text x="205" y="320" class="small" text-anchor="start">The interval crosses zero, so this run does not establish a reliable binding repair.</text>
<text x="85" y="342" class="small" text-anchor="start" font-weight="600">Execution caveat:</text>
<text x="220" y="342" class="small" text-anchor="start">The API reported zero reasoning tokens in every response; the comparison concerns settings, not observed hidden-reasoning volume.</text>
