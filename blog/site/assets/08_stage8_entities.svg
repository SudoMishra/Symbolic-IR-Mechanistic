<text x="120" y="670" class="small" text-anchor="start" font-weight="600">Representation definitions:</text>
<text x="285" y="670" class="small" text-anchor="start">Raw = literal names, emails, account numbers.  Random = arbitrary alphanumeric mask.</text>
<text x="285" y="692" class="small" text-anchor="start">Untyped = &lt;ENTITY_1&gt;, &lt;ENTITY_2&gt; (type-neutral).  Typed = &lt;ACCOUNT_1&gt;, &lt;EMAIL_2&gt; (preserves entity type).</text>
<text x="120" y="725" class="small" text-anchor="start" fill="#172033" font-weight="600">Key findings: Typed handles gave Qwen a +17.5 pp lift at identical length; all masked formats eliminated raw PII exposure (100% -&gt; 0%).</text>
