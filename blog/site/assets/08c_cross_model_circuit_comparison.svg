<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Figure 8C: Mixer-over-MLP binding effect across six architectures</title>
<desc id="desc">A single-scale horizontal forest plot compares the paired attention-mixer minus MLP first-token binding effect for six models. Every 95 percent paired cluster-bootstrap interval lies to the right of zero. A companion table reports the registered hub, observed continuation component, and specificity result for each model.</desc>
