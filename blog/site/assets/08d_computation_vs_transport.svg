<text x="660.0" y="173.0" class="label">Layer 24 · pos_citation · distinguishing token (d−1)</text>
<text x="660.0" y="209.0" class="title">Mixer shift: +0.001 [-0.147, +0.179]</text>
<text x="660.0" y="242.0" class="legend">Interval spans zero; positive-control gate did not qualify.</text>
<text x="660.0" y="266.0" class="legend">Head-level screening stopped under the registered rule.</text>
<text x="660.0" y="308.0" class="label">Scope of the result</text>
<text x="660.0" y="333.0" class="muted">Other heads, layers and positions remain open questions.</text>
<text x="660.0" y="357.0" class="muted">Historical Stage 7B and repaired discovery use different</text>
<text x="660.0" y="378.0" class="muted">cohorts and implementations; this is not a paired repair effect.</text>
<text x="660.0" y="420.0" class="label">Source-label patching precedes relevant evidence.</text>
<text x="660.0" y="446.0" class="muted">An identifier-identity or copying effect can occur there</text>
<text x="660.0" y="467.0" class="muted">without isolating evidence–identifier binding.</text>
<text x="660.0" y="502.0" class="label">Computation versus transport remains unresolved.</text>
<rect x="62.0" y="578.0" width="1096.0" height="120.0" fill="#e8edff" stroke="#b9c7ff" rx="7"/>
<text x="82.0" y="606.0" class="label">Source-label residual: +2.125 [+1.733, +2.552]</text>
<text x="82.0" y="632.0" class="legend">Large residual-patch effects do not prove direct transport from embeddings, linear computation, or the first site of binding.</text>
<text x="82.0" y="658.0" class="legend">Discovery position effects motivate further tests; they do not validate the later fitted subspace.</text>
