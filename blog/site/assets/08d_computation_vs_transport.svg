<title id="title">Figure 8D: Resolving Computation vs. Transport &amp; Distinguishing-Token Evaluation</title>
<desc id="desc">Two panels examine causal mechanisms in Qwen 2.5 1.5B. Panel A displays position-resolved causal shifts at Layer 14 across the residual stream, attention mixer, and MLP across source-label, evidence, post-evidence, and citation positions. Panel B contrasts the unshifted prefix evaluation with the repaired distinguishing-token evaluation at Layer 24 citation position.</desc>
