<text x="90.0" y="584.0" class="label" fill="#315efb">HOW TO READ · CAUSAL COMPUTATION VS. TRANSPORT FINDINGS</text>
<text x="90.0" y="608.0" class="legend">1. Linear Handle Propagation: Handle identity is directly stored and transported via the residual stream (+2.125 nats at source label).</text>
<text x="90.0" y="628.0" class="muted">   Mixer and MLP components at source label positions are inactive (-0.077 and -0.015), showing early embedding transport rather than mid-layer synthesis.</text>
<text x="90.0" y="650.0" class="legend">2. Post-Evidence Localization: First causal binding signal emerges at Layer 14 pos_post_evidence (+0.042 [+0.018, +0.064] label swap, +0.209 content swap).</text>
<text x="90.0" y="672.0" class="muted">3. Distinguishing-Token Null: At the citation position, the mixer does not route distinguishing tokens (+0.001 [-0.147, +0.179]). Binding is computed upstream.</text>
