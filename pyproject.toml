[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-symbolic-ir"
version = "0.1.0"
description = "Reproducible experiments on symbolic identifier representations in LLM reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
analysis = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "scipy>=1.12"]
openai = ["openai>=1.40"]
hf = ["torch>=2.2", "transformers>=5.20", "accelerate>=0.33"]
local = ["llama-cpp-python>=0.3.16"]
mechinterp = ["torch>=2.2", "transformers>=5.20", "scikit-learn>=1.4"]

[project.scripts]
symbolic-ir = "symbolic_ir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
